<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .contact-section {
        background: #222;
        color: #fff;
        padding: 40px;
        border-radius: 10px;
        width: 100%;
        max-width: 450px;
    }

    .contact-section h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    .form-control {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 5px;
        border: none;
        background: #333;
        color: #fff;
    }

    .form-control::placeholder {
        color: #ccc;
    }

    .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: linear-gradient(90deg, #6a11cb, #2575fc);
        color: #fff;
        cursor: pointer;
        font-size: 16px;
    }

    .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #form-message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="contact-section">
    <h1>Contact Me</h1>
    <form id="contact-form">
        <input type="text" id="from_name" class="form-control" placeholder="Name" required>
        <input type="email" id="email_id" class="form-control" placeholder="Email" required>
        <textarea id="message" class="form-control" rows="4" placeholder="Message" required></textarea>
        <button type="submit" class="btn" id="submit-btn">Submit</button>
        <p id="form-message"></p>
    </form>
</div>

<!-- EmailJS SDK -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
    // Initialize EmailJS with your public key
    emailjs.init("jpN6fK64PFeBdBUZB");

    const form = document.getElementById("contact-form");
    const formMessage = document.getElementById("form-message");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        const templateParams = {
            from_name: document.getElementById("from_name").value,
            email_id: document.getElementById("email_id").value,
            message: document.getElementById("message").value
        };

        emailjs.send("service_ovj4zzb", "template_6bvpefj", templateParams)
            .then(function(response) {
                formMessage.style.color = "green";
                formMessage.textContent = "Message sent successfully!";
                form.reset();
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit";
            }, function(error) {
                formMessage.style.color = "red";
                formMessage.textContent = "Failed to send message. Try again.";
                console.log("EmailJS Error:", error);
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit";
            });
    });
</script>

</body>
</html>
